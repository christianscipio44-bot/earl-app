<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171b21;
    --panel: #232935;
    --line: #333c49;
    --ink: #ECE7DC;
    --ink-dim: #9AA3B0;
    --accent: #E3A83B;
    --user-bg: #2b323e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #EFEBE1; --panel: #F7F4EC; --line: #CFC7B4;
      --ink: #201C14; --ink-dim: #6B6455; --accent: #B9791E; --user-bg: #E2DBC8;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; }
  header { flex: 0 0 auto; padding: 22px 20px 16px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
  .wordmark { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 46px; line-height: 0.85; display: flex; gap: 10px; }
  .wordmark .dot { color: var(--accent); }
  .tagline { font-size: 13.5px; color: var(--ink-dim); margin-top: 4px; max-width: 46ch; }
  #thread { flex: 1 1 auto; overflow-y: auto; padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 13px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .row.user .bubble { background: var(--user-bg); border-radius: 3px; }
  .row.earl .bubble { border-left: 3px solid var(--accent); padding-left: 14px; }
  .row.earl .label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: var(--accent); display: block; margin-bottom: 5px; }
  .thinking { font-size: 13px; color: var(--ink-dim); font-style: italic; }
  .empty-state { margin: auto; text-align: center; color: var(--ink-dim); padding: 40px 24px; max-width: 40ch; }
  .empty-state .big { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { border: 1px solid var(--line); padding: 7px 12px; font-size: 13px; color: var(--ink-dim); cursor: pointer; background: transparent; font-family: inherit; }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  footer { flex: 0 0 auto; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  form { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); padding: 8px 8px 8px 14px; }
  textarea { flex: 1; resize: none; background: transparent; border: none; outline: none; color: var(--ink); font-family: inherit; font-size: 15px; line-height: 1.4; max-height: 120px; padding: 6px 0; }
  button.send { flex: 0 0 auto; background: var(--accent); color: #1a1408; border: none; font-weight: 600; font-size: 14px; padding: 10px 16px; cursor: pointer; }
  button.send:disabled { opacity: 0.45; cursor: default; }
  .foot-note { font-size: 11px; color: var(--ink-dim); margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wordmark">EARL<span class="dot">.</span></div>
    <div class="tagline">Straight answers. No hedging, no upsell nagging, no runaround.</div>
  </header>
  <div id="thread"></div>
  <footer>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Ask Earl something..."></textarea>
      <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
    <div class="foot-note">Running on your own server.</div>
  </footer>
</div>

<script>
const thread = document.getElementById('thread');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let history = [];
let busy = false;

const STARTERS = [
  "What should I actually know before buying a used car?",
  "Give me a straight take on cast iron vs nonstick.",
  "Explain how a mortgage actually works."
];

function renderEmptyState() {
  thread.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'empty-state';
  wrap.innerHTML = `<div class="big">Ask Earl anything.</div><div>He'll give you the answer first and skip the throat-clearing.</div><div class="chips">${STARTERS.map(s => `<button class="chip" type="button">${s}</button>`).join('')}</div>`;
  thread.appendChild(wrap);
  wrap.querySelectorAll('.chip').forEach((btn, i) => btn.addEventListener('click', () => { input.value = STARTERS[i]; sendMessage(); }));
}

function addRow(role, text) {
  const empty = thread.querySelector('.empty-state');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'earl');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role !== 'user') {
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = 'EARL';
    bubble.appendChild(label);
  }
  const textNode = document.createElement('span');
  textNode.textContent = text;
  bubble.appendChild(textNode);
  row.appendChild(bubble);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return textNode;
}

function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
form.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });

async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;

  addRow('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  autoGrow();

  busy = true;
  sendBtn.disabled = true;
  const target = addRow('earl', '');
  target.parentElement.classList.add('thinking');
  target.textContent = 'Thinking...';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await resp.json();
    target.parentElement.classList.remove('thinking');
    if (!resp.ok) {
      target.textContent = data.error || "Something broke on my end.";
    } else {
      target.textContent = data.text;
      history.push({ role: 'assistant', content: data.text });
    }
  } catch (err) {
    target.parentElement.classList.remove('thinking');
    target.textContent = "Can't reach the server right now. Try again.";
  } finally {
    busy = false;
    sendBtn.disabled = false;
    thread.scrollTop = thread.scrollHeight;
  }
}

renderEmptyState();
</script>
</body>
</html>
